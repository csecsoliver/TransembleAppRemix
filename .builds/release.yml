image: ubuntu/lts
packages:
  - openjdk-21-jdk-headless
  - unzip
  - wget
environment:
  ANDROID_SDK_ROOT: /home/build/android-sdk
  ANDROID_HOME: /home/build/android-sdk
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g"
sources:
  - https://git.sr.ht/~olio/trainsemble-app
secrets:
  - 565b4a81-d997-4dff-ab0b-f2dae80839cf
tasks:
  - setup-sdk: |
      wget -q https://dl.google.com/android/repository/commandlinetools-linux-15641748_latest.zip
      unzip -q commandlinetools-linux-*.zip
      mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
      mv cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
      export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
      yes | sdkmanager --licenses > /dev/null 2>&1 || true
  - build-release: |
      cd trainsemble-app
      echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      set +x
      cat ~/pb.properties >> local.properties
      set -x
      chmod +x gradlew
      ./gradlew assembleRelease --no-daemon --stacktrace
artifacts:
  - trainsemble-app/app/build/outputs/apk/release/app-release.apk
submitter:
  git.sr.ht:
    allow-refs:
      - "refs/tags/*"
